name: books
start_urls:
  - https://books.toscrape.com
allowed_domains:
  - books.toscrape.com
max_depth: 1

pipelines:
  - class: spiders.books.CleanBookPipeline
  - type: jsonl
    path: output.jsonl

pages:
  default:
    follow:
      - css: a
        same_domain: true
    extract:
      page:
        fields:
          title: title
