<svg xmlns="http://www.w3.org/2000/svg" width="960" height="860" viewBox="0 0 960 860" role="img" aria-labelledby="title description">
  <title id="title">Webuse crawl workflow</title>
  <desc id="description">Seeds enter a queue of pending requests. Available requests are checked and downloaded, then responses are parsed and items processed or saved during the crawl. Accepted follow-ups return to the queue. When the queue is empty, wait for active work or finish.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L8 4L0 8Z" fill="#4b678c"/>
    </marker>
    <style>
      text { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #182b45; text-anchor: middle; }
      .heading { font-size: 23px; font-weight: 650; }
      .label { font-size: 18px; fill: #42536b; }
      .engine { fill: #eaf2ff; stroke: #6b8db8; stroke-width: 1.7; }
      .caller { fill: #f3efff; stroke: #927ac2; stroke-width: 1.7; }
      .transport { fill: #e6f6f1; stroke: #5e9484; stroke-width: 1.7; }
      .edge { fill: none; stroke: #4b678c; stroke-width: 2.5; stroke-linejoin: round; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="960" height="860" rx="16" fill="#f8fafc"/>

  <!-- Start: seeds supplied by a spider or direct API call. -->
  <rect x="190" y="28" width="180" height="56" rx="28" class="caller"/>
  <text x="280" y="64" class="heading">Seeds</text>
  <path d="M280 84V119" class="edge"/>

  <!-- Queue: individual pending request slots. -->
  <rect x="160" y="124" width="240" height="88" rx="8" class="engine"/>
  <text x="280" y="153" class="heading">Request queue</text>
  <g fill="#ffffff" stroke="#6b8db8" stroke-width="1.5">
    <rect x="180" y="169" width="32" height="27"/>
    <rect x="222" y="169" width="32" height="27"/>
    <rect x="264" y="169" width="32" height="27"/>
    <rect x="306" y="169" width="32" height="27"/>
    <rect x="348" y="169" width="32" height="27"/>
  </g>
  <path d="M280 212V236" class="edge"/>

  <!-- Decisions: queue availability and normal termination. -->
  <path d="M280 240L400 300L280 360L160 300Z" class="engine"/>
  <text x="280" y="308" class="heading">Request?</text>
  <path d="M400 300H616" class="edge"/>
  <text x="510" y="287" class="label">No</text>

  <path d="M740 240L860 300L740 360L620 300Z" class="engine"/>
  <text x="740" y="294" class="heading">Work</text>
  <text x="740" y="320" class="heading">active?</text>
  <path d="M740 240V176H404" class="edge"/>
  <text x="564" y="161" class="label">Yes: wait</text>

  <path d="M280 360V396" class="edge"/>
  <text x="308" y="386" class="label">Yes</text>
  <rect x="160" y="400" width="240" height="64" class="engine"/>
  <text x="280" y="440" class="heading">Check request</text>

  <path d="M280 464V506" class="edge"/>
  <rect x="160" y="510" width="240" height="64" class="transport"/>
  <text x="280" y="538" class="heading">Download</text>
  <text x="280" y="561" class="label">curl_cffi</text>

  <!-- Predefined process: response handling, including spider pipelines. -->
  <path d="M280 574V616" class="edge"/>
  <rect x="160" y="620" width="240" height="78" class="caller"/>
  <path d="M174 620V698M386 620V698" stroke="#927ac2" stroke-width="1.7"/>
  <text x="280" y="652" class="heading">Parse response</text>
  <text x="280" y="679" class="label">Process / save items</text>

  <path d="M280 698V746" class="edge"/>
  <text x="333" y="730" class="label">follow-ups</text>
  <rect x="160" y="750" width="240" height="64" class="engine"/>
  <text x="280" y="790" class="heading">Follow-up policy</text>
  <path d="M160 782H72V176H156" class="edge"/>

  <!-- Completion: items have already been processed during the crawl. -->
  <path d="M740 360V420" class="edge"/>
  <text x="768" y="397" class="label">No</text>
  <rect x="650" y="424" width="180" height="56" rx="28" class="engine"/>
  <text x="740" y="460" class="heading">Done</text>
</svg>
