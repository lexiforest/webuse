services:
  webuse:
    build:
      context: ..
      dockerfile: ui/Dockerfile
    command: npm run start
    working_dir: /app/ui
    ports:
      - "2951:2951"
    environment:
      HOST: 0.0.0.0
      PORT: 2951
      WEBUSE_DB_PATH: /data/webuse-ui.sqlite
      WEBUSE_WORK_DIR: /data/runs
      WEBUSE_PYTHON_COMMAND: /app/.venv/bin/python
    volumes:
      - webuse-data:/data

volumes:
  webuse-data:
